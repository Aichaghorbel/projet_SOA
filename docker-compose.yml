
services:

  # ==========================================
  # DATABASE 1 - STUDENTS
  # ==========================================
  postgres-students:
    image: postgres:17
    container_name: postgres-students
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STUDENTS_DB_NAME}
      POSTGRES_USER: ${STUDENTS_DB_USER}
      POSTGRES_PASSWORD: ${STUDENTS_DB_PASSWORD}
    ports:
      - "${STUDENTS_DB_PORT}:5432"
    volumes:
      - students_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # DATABASE 2 - COURSES
  # ==========================================
  postgres-courses:
    image: postgres:17
    container_name: postgres-courses
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COURSES_DB_NAME}
      POSTGRES_USER: ${COURSES_DB_USER}
      POSTGRES_PASSWORD: ${COURSES_DB_PASSWORD}
    ports:
      - "${COURSES_DB_PORT}:5432"
    volumes:
      - courses_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # DATABASE 3 - ENROLLMENTS
  # ==========================================
  postgres-enrollments:
    image: postgres:17
    container_name: postgres-enrollments
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ENROLLMENTS_DB_NAME}
      POSTGRES_USER: ${ENROLLMENTS_DB_USER}
      POSTGRES_PASSWORD: ${ENROLLMENTS_DB_PASSWORD}
    ports:
      - "${ENROLLMENTS_DB_PORT}:5432"
    volumes:
      - enrollments_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  
  # ==========================================
  # ZOOKEEPER
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"

    ports:
      - "2181:2181"

    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s


  # ==========================================
  # KAFKA - MESSAGE BROKER
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 5"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================
  # JAEGER - DISTRIBUTED TRACING
  # ==========================================
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

# ==========================================
# PERSISTENT VOLUMES
# ==========================================
volumes:
  students_data:
  courses_data:
  enrollments_data:
