services:
  # ========================================================
  # 1. SERVICE SOAP : University Administration
  # ========================================================
  soap-university-administration:
    build:
      context: ./projet_SOA-feature-admin-data-model/university-administration
      dockerfile: Dockerfile
    container_name: educampus-soap-admin
    restart: unless-stopped
    ports:
      - "8083:8083"

  # ========================================================
  # 2. SERVICE REST : Academic Service + Base PostgreSQL
  # ========================================================
  postgres-academic:
    image: postgres:16-alpine
    container_name: educampus-postgres-academic
    restart: unless-stopped
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
    ports:
      - "5432:5432"
    volumes:
      - academic_data:/var/lib/postgresql/data
      - ./projet_SOA-feature-openapi-students-courses/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rest-academic-service:
    build:
      context: ./projet_SOA-feature-openapi-students-courses/academic-service
      dockerfile: Dockerfile
    container_name: educampus-rest-academic
    restart: unless-stopped
    depends_on:
      postgres-academic:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-academic:5432/academic_db
      DB_USERNAME: academic
      DB_PASSWORD: academic
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

  # ========================================================
  # 3. SERVICE gRPC : Smart Space & Exam + Base PostgreSQL
  # ========================================================
  postgres-smartspace:
    image: postgres:16-alpine
    container_name: educampus-postgres-smartspace
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartspace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # Mappé sur 5433 côté PC pour éviter tout conflit avec 5432
    volumes:
      - smartspace_data:/var/lib/postgresql/data
      - ./projet_SOA-feature-grpc-examsession-examprogress/gRPC/src/main/resources/init-room.sql:/docker-entrypoint-initdb.d/01-init-room.sql:ro
      - ./projet_SOA-feature-grpc-examsession-examprogress/gRPC/src/main/resources/init-exam.sql:/docker-entrypoint-initdb.d/02-init-exam.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  grpc-smartspace-service:
    build:
      context: ./projet_SOA-feature-grpc-examsession-examprogress/gRPC
      dockerfile: Dockerfile
    container_name: educampus-grpc-smartspace
    restart: unless-stopped
    depends_on:
      postgres-smartspace:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-smartspace:5432/smartspace_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8082
      GRPC_PORT: 9090
    ports:
      - "8082:8082"   # REST Actuator & Web
      - "9090:9090"   # gRPC HTTP/2 Server

volumes:
  academic_data:
  smartspace_data:
