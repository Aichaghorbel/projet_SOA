syntax = "proto3";
package educampus.exam.v1;
option java_package = "com.educampus.smartspace.grpc.exam";
option java_multiple_files = true;
option java_outer_classname = "ExamProto";

enum ProgressStatus {
  PROGRESS_STATUS_UNSPECIFIED = 0;
  CORRECTING = 1;
  CORRECTED = 2;
  ERROR = 3;
}

message StudentAnswerInput {
  int64 question_id = 1;
  int64 selected_option_id = 2;   // for MCQ (0 if not applicable)
  string text_response = 3;        // for SHORT_ANSWER (empty if not applicable)
}

message ExamSubmissionRequest {
  int64 exam_session_id = 1;
  int64 exam_id = 2;
  int64 student_id = 3;
  repeated StudentAnswerInput answers = 4;
}

message ExamSubmissionResponse {
  int64 exam_session_id = 1;
  double total_score = 2;
  double max_score = 3;
  string grade = 4;
  bool passed = 5;
}

message ExamProgressEvent {
  int64 exam_session_id = 1;
  int64 question_id = 2;
  int32 question_number = 3;
  ProgressStatus status = 4;
  double points_earned = 5;
  int32 progress_percentage = 6;
  string timestamp = 7;
  bool is_final = 8;
}

service ExamService {
  rpc SubmitExam(ExamSubmissionRequest) returns (ExamSubmissionResponse);
  rpc StreamExamProgress(ExamSubmissionRequest) returns (stream ExamProgressEvent);
}
