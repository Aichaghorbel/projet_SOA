# ==========================================================
# EduCampus: Smart Space & Exam Service (gRPC)
# Main Application Configuration (properties)
# ==========================================================

# Server configuration
server.port=${PORT:8082}

# gRPC Server configuration
grpc.server.port=${GRPC_PORT:9090}

# Spring Application configuration
spring.application.name=smart-space-exam-service

# PostgreSQL Datasource configuration (Docker Postgres)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartspace_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
# Using 'update' so Hibernate safely creates/validates schema automatically
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Logging configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.educampus.smartspace=${APP_LOG_LEVEL:DEBUG}
