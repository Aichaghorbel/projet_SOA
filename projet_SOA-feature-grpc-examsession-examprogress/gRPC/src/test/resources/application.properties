# ==========================================================
# EduCampus: Smart Space & Exam Service (gRPC)
# Test Configuration (properties)
# ==========================================================

# Server configuration (random port for tests)
server.port=0

# gRPC in-process server (-1 disables external network binding during tests)
grpc.server.port=-1

# Spring Application configuration
spring.application.name=smart-space-exam-service-test

# H2 in-memory Database for testing (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Actuator configuration
management.endpoints.web.exposure.include=health,info

# Logging configuration
logging.level.root=INFO
logging.level.com.educampus.smartspace=DEBUG
