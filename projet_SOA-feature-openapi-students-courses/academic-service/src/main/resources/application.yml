server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: academic-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academic_db}
    username: ${DB_USERNAME:academic}
    password: ${DB_PASSWORD:academic}
  jpa:
    open-in-view: false
    hibernate:
      # none tant que le script SQL du Membre 2 n'est pas chargé ;
      # passer à validate (JPA_DDL_AUTO=validate) une fois les tables créées
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
