server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: academic-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academic_db}
    username: ${DB_USERNAME:academic}
    password: ${DB_PASSWORD:academic}
  jpa:
    open-in-view: false
    hibernate:
      # none tant que le script SQL du Membre 2 n'est pas chargé ;
      # passer à validate (JPA_DDL_AUTO=validate) une fois les tables créées
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

university-admin:
  url: ${UNIVERSITY_ADMIN_URL:http://localhost:8083/ws}
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
